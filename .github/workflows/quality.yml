name: quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Expose Playwright Chromium to Lighthouse
        shell: bash
        run: |
          echo "CHROME_PATH=$(find ~/.cache/ms-playwright -path '*/chrome-linux/chrome' -type f | head -n 1)" >> "$GITHUB_ENV"
      - run: npm run check
